name: Build signed v2rayNG Globe APKs

on:
  workflow_dispatch:
  push:
    branches:
      - codex/globe-notification

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code and native submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install exact NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sed -i '10i\
          \
              ndkVersion = "29.0.14206865"' V2rayNG/app/build.gradle.kts

      - name: Build libhevtun
        run: bash compile-hevtun.sh

      - name: Copy libhevtun
        run: cp -r libs V2rayNG/app

      - name: Resolve AndroidLibXrayLite tag
        run: |
          pushd AndroidLibXrayLite
          CURRENT_TAG="$(git describe --tags --abbrev=0)"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          popd

      - name: Download matching libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Setup Java
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Globe signing key
        env:
          GLOBE_KEYSTORE_BASE64: ${{ secrets.GLOBE_KEYSTORE_BASE64 }}
        run: |
          test -n "$GLOBE_KEYSTORE_BASE64"
          GLOBE_KEYSTORE_PATH="$RUNNER_TEMP/v2rayng-globe-release.jks"
          printf '%s' "$GLOBE_KEYSTORE_BASE64" | base64 --decode > "$GLOBE_KEYSTORE_PATH"
          chmod 600 "$GLOBE_KEYSTORE_PATH"
          echo "GLOBE_KEYSTORE_PATH=$GLOBE_KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Test and build signed Globe release APKs
        working-directory: V2rayNG
        env:
          GLOBE_KEYSTORE_PASSWORD: ${{ secrets.GLOBE_KEYSTORE_PASSWORD }}
          GLOBE_KEY_ALIAS: ${{ secrets.GLOBE_KEY_ALIAS }}
          GLOBE_KEY_PASSWORD: ${{ secrets.GLOBE_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod 755 gradlew
          ./gradlew :app:testPlaystoreDebugUnitTest :app:compilePlaystoreDebugKotlin \
            :app:assemblePlaystoreDebug :app:testGlobeDebugUnitTest :app:assembleGlobeRelease \
            -Pandroid.injected.signing.store.file="$GLOBE_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$GLOBE_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$GLOBE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$GLOBE_KEY_PASSWORD"

      - name: Verify package, label, signature, icon, and native libraries
        env:
          GLOBE_KEYSTORE_PASSWORD: ${{ secrets.GLOBE_KEYSTORE_PASSWORD }}
          GLOBE_KEY_ALIAS: ${{ secrets.GLOBE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_DIR="V2rayNG/app/build/outputs/apk/globe/release"
          VERIFY_DIR="$RUNNER_TEMP/globe-verification"
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          AAPT2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          APKSIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          mkdir -p "$VERIFY_DIR"
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          test "${#APKS[@]}" -eq 5
          EXPECTED_CERT_SHA256="$(
            keytool -exportcert \
              -keystore "$GLOBE_KEYSTORE_PATH" \
              -storepass "$GLOBE_KEYSTORE_PASSWORD" \
              -alias "$GLOBE_KEY_ALIAS" | sha256sum | awk '{print $1}'
          )"
          test "$EXPECTED_CERT_SHA256" = '81361f641498d6d64bbc17bd835943d5f5d66653b14b9d698a9d4f912b7c7894'
          for APK in "${APKS[@]}"; do
            NAME="$(basename "$APK")"
            BADGING="$($AAPT dump badging "$APK")"
            grep -F "package: name='com.v2ray.ang.globe'" <<< "$BADGING"
            grep -F "versionCode='4000752'" <<< "$BADGING"
            grep -F "application-label:'Globe VPN'" <<< "$BADGING"
            ! grep -E "^application-label[^:]*:'v2rayNG'$" <<< "$BADGING"
            "$AAPT" dump resources "$APK" | grep -F 'drawable/ic_stat_globe'
            "$AAPT" dump resources "$APK" | grep -F 'drawable/ic_globe_launcher_foreground'
            "$APKSIGNER" verify --verbose --print-certs "$APK" > "$VERIFY_DIR/$NAME.txt" 2>&1
            grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' "$VERIFY_DIR/$NAME.txt"
            ACTUAL_CERT_SHA256="$(
              grep -im1 'certificate.*SHA-256.*digest' "$VERIFY_DIR/$NAME.txt" | \
                sed 's/.*: //' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]'
            )"
            echo "$NAME signer SHA-256: $ACTUAL_CERT_SHA256"
            test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          done
          ARM64_APK=("$APK_DIR"/*arm64-v8a*.apk)
          UNIVERSAL_APK=("$APK_DIR"/*universal*.apk)
          test "${#ARM64_APK[@]}" -eq 1
          test "${#UNIVERSAL_APK[@]}" -eq 1
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" dex code \
            --class com.v2ray.ang.handler.NotificationManager \
            "${ARM64_APK[0]}" > "$VERIFY_DIR/NotificationManager.smali"
          GLOBE_RESOURCE_ID="$($AAPT dump resources "${ARM64_APK[0]}" | \
            sed -n 's/^ *resource \(0x[0-9a-fA-F]*\).*drawable\/ic_stat_globe.*/\1/p' | head -n 1)"
          test -n "$GLOBE_RESOURCE_ID"
          GLOBE_XML_PATH="$($AAPT dump resources "${ARM64_APK[0]}" | \
            grep -A1 'drawable/ic_stat_globe' | \
            sed -n 's/.*(file) \([^ ]*\.xml\).*/\1/p' | head -n 1)"
          test -n "$GLOBE_XML_PATH"
          "$AAPT2" dump xmltree --file "$GLOBE_XML_PATH" "${ARM64_APK[0]}" \
            > "$VERIFY_DIR/ic_stat_globe.xmltree.txt"
          ! grep -F 'strokeColor' "$VERIFY_DIR/ic_stat_globe.xmltree.txt"
          ! grep -F 'strokeWidth' "$VERIFY_DIR/ic_stat_globe.xmltree.txt"
          test "$(grep -cF 'E: path' "$VERIFY_DIR/ic_stat_globe.xmltree.txt")" -eq 3
          test "$(grep -cE 'fillColor.*#ffffffff' "$VERIFY_DIR/ic_stat_globe.xmltree.txt")" -eq 3
          grep -F 'setSmallIcon(I)' "$VERIFY_DIR/NotificationManager.smali"
          test "$(grep -cF 'setSmallIcon(I)' "$VERIFY_DIR/NotificationManager.smali")" -eq 5
          ! grep -F 'android.app.preferSmallIcon' "$VERIFY_DIR/NotificationManager.smali"
          echo "Foreground notification globe resource ID: $GLOBE_RESOURCE_ID" \
            > "$VERIFY_DIR/foreground-notification-icon.txt"
          curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.5/jadx-1.5.5.zip \
            -o "$RUNNER_TEMP/jadx.zip"
          unzip -q "$RUNNER_TEMP/jadx.zip" -d "$RUNNER_TEMP/jadx"
          chmod 755 "$RUNNER_TEMP/jadx/bin/jadx"
          "$RUNNER_TEMP/jadx/bin/jadx" \
            --single-class com.v2ray.ang.handler.NotificationManager \
            --single-class-output "$VERIFY_DIR/NotificationManager.java" \
            "${ARM64_APK[0]}" || test -s "$VERIFY_DIR/NotificationManager.java"
          grep -F 'setSmallIcon(R.drawable.ic_stat_globe)' \
            "$VERIFY_DIR/NotificationManager.java"
          test "$(grep -cF 'setSmallIcon(R.drawable.ic_stat_globe)' \
            "$VERIFY_DIR/NotificationManager.java")" -eq 5
          grep -F '.setPriority(0)' "$VERIFY_DIR/NotificationManager.java"
          ! grep -F '.setPriority(-1)' "$VERIFY_DIR/NotificationManager.java"
          ! grep -E 'setSmallIcon\(R\.drawable\.ic_stat_(name|proxy|direct)\)' \
            "$VERIFY_DIR/NotificationManager.java"
          unzip -l "${ARM64_APK[0]}" | grep -F 'lib/arm64-v8a/libgojni.so'
          unzip -l "${ARM64_APK[0]}" | grep -F 'lib/arm64-v8a/libhev-socks5-tunnel.so'
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            unzip -l "${UNIVERSAL_APK[0]}" | grep -F "lib/$ABI/libgojni.so"
            unzip -l "${UNIVERSAL_APK[0]}" | grep -F "lib/$ABI/libhev-socks5-tunnel.so"
          done

      - name: Upload signed Globe APKs and verification
        uses: actions/upload-artifact@v7
        with:
          name: v2rayNG-globe-signed-release
          path: |
            V2rayNG/app/build/outputs/apk/globe/release/*.apk
            ${{ runner.temp }}/globe-verification/*.txt
            ${{ runner.temp }}/globe-verification/*.smali
            ${{ runner.temp }}/globe-verification/*.java
          if-no-files-found: error
